<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ticktock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(255, 255, 255, 0.03),
                rgba(255, 255, 255, 0.03) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 10;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 20%, #000 85%);
            pointer-events: none;
            z-index: 9;
        }

        .terminal {
            background: #050505;
            border: 1px solid #222;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.9);
            max-width: 720px;
            width: 95%;
            padding: 2.2rem;
            position: relative;
            z-index: 5;
        }

        .header {
            color: #666;
            font-size: 0.8rem;
            margin-bottom: 1.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .header span {
            color: #fff;
        }

        .prompt {
            color: #aaa;
            margin-bottom: 0.6rem;
            font-size: 0.95rem;
        }

        .prompt::before {
            content: "> ";
            color: #fff;
        }

        .encoded {
            background: #000;
            border: 1px solid #333;
            color: #fff;
            font-size: 0.9rem;
            letter-spacing: 1.5px;
            word-break: break-all;
            padding: 1.4rem;
            margin: 1.5rem 0 2rem;
            line-height: 1.6;
            position: relative;
        }

        .encoded::before {
            content: "[ CLASSIFIED TRANSMISSION ]";
            position: absolute;
            top: -11px;
            left: 14px;
            background: #050505;
            padding: 0 10px;
            font-size: 0.7rem;
            color: #888;
            letter-spacing: 2px;
        }

        label {
            display: block;
            color: #777;
            font-size: 0.85rem;
            margin-bottom: 0.6rem;
            letter-spacing: 1px;
        }

        .form-control {
            background: #000 !important;
            border: 1px solid #333 !important;
            color: #fff !important;
            font-family: 'Share Tech Mono', monospace !important;
            border-radius: 0 !important;
            padding: 0.9rem 1.1rem !important;
            font-size: 1.15rem !important;
        }

        .form-control:focus {
            box-shadow: 0 0 0 1px #fff !important;
            outline: none;
            border-color: #fff !important;
        }

        .form-control::placeholder {
            color: #333 !important;
        }

        .btn-submit {
            background: transparent;
            border: 1px solid #444;
            color: #ccc;
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 3px;
            padding: 0.85rem 1.5rem;
            border-radius: 0;
            transition: all 0.2s ease;
            width: 100%;
            margin-top: 1.2rem;
            text-transform: uppercase;
        }

        .btn-submit:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        #feedback {
            margin-top: 1.4rem;
            min-height: 1.5rem;
            font-size: 0.95rem;
            letter-spacing: 1.5px;
        }

        .blink {
            animation: blink 1.1s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        #next-link {
            display: none;
            margin-top: 1.5rem;
            text-align: center;
        }

        #next-link a {
            color: #fff;
            text-decoration: underline;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="terminal">
        <div class="header">
            SYSTEM // PART <span>01</span> OF 05 // STATUS: UNKNOWN
        </div>

        <div class="prompt">Something is watching you.</div>
        <div class="prompt">Decode the transmission.</div>

        <div class="encoded">
            SSBhbSB0aGUgb25seSB0aGluZyB5b3Ugc3BlbmQgYnkgbG9zaW5nIGl0LCB5ZXQgeW91IHBhbmljIHdoZW4geW91IGhhdmUgdG9vIG11Y2ggb2YgaXQgYW5kIHdlZXAgd2hlbiBpdCBydW5zIG91dC4=
        </div>

        <div>
            <label for="answer">> YOUR RESPONSE:</label>
            <input type="text" 
                   class="form-control" 
                   id="answer" 
                   placeholder="type here..." 
                   autocomplete="off"
                   spellcheck="false"
                   autofocus>
        </div>

        <button class="btn-submit" onclick="checkAnswer()">
            Submit
        </button>

        <p id="feedback"></p>

        <div id="next-link">
            <a href="part2.wav" id="spectrogram-link"></a>
        </div>
    </div>

    <script>
        function checkAnswer() {
            const input = document.getElementById("answer").value.trim().toLowerCase();
            const feedback = document.getElementById("feedback");
            const nextLink = document.getElementById("next-link");

            if (input === "time") {
                feedback.style.color = "#fff";
                feedback.innerHTML = "> CORRECT <span class='blink'>_</span>";
                
                // Show the manual link
                nextLink.style.display = "block";

                // Try automatic redirect
                setTimeout(() => {
                    window.location.href = "part2.wav";
                }, 1600);
            } else if (input === "") {
                feedback.style.color = "#888";
                feedback.textContent = "> SILENCE WILL NOT SAVE YOU";
                nextLink.style.display = "none";
            } else {
                feedback.style.color = "#888";
                feedback.textContent = "> WRONG. IT KNOWS YOU TRIED.";
                nextLink.style.display = "none";
            }
        }

        document.getElementById("answer").addEventListener("keydown", function(e) {
            if (e.key === "Enter") checkAnswer();
        });

        document.addEventListener('contextmenu', function (event) {
            event.preventDefault();
        });
    </script>
</body>
</html>
